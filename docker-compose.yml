version: "3.8"

services:
  postgres-users:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_users_data:/var/lib/postgresql/data

  postgres-products:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_products_data:/var/lib/postgresql/data

  postgres-cart:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_cart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pg_cart_data:/var/lib/postgresql/data

  postgres-orders:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pg_orders_data:/var/lib/postgresql/data

volumes:
  pg_users_data:
  pg_products_data:
  pg_cart_data:
  pg_orders_data:
